services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: root
    volumes:
      - ..:/workspace:cached
      - ../.kilo/.local:/home/vscode/.local
      - gh-config:/home/vscode/.config/gh
    # Preserve the existing localhost access to the separately managed test stack.
    network_mode: host
    command: >-
      /bin/sh -c "chown -R vscode:vscode /home/vscode/.local /home/vscode/.config/gh && sleep infinity"

volumes:
  gh-config:
